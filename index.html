    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg);
            overflow: hidden;
            position: relative;
        }

        /* 背景に静かに呼吸するような光のレイヤーを追加 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 45%, rgba(169, 156, 143, 0.16) 0%, rgba(169, 156, 143, 0) 60%);
            opacity: 0;
            animation: ambientBreathe 6s ease-in-out 1.4s infinite;
            pointer-events: none;
        }

        .entrance-container {
            position: relative;
            text-align: center;
            opacity: 0;
            animation: containerRise 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
        }

        .logo-frame {
            position: relative;
            display: inline-block;
        }

        /* ロゴを包む淡いオーラ。フェードインと同時にふわっと広がる */
        .logo-frame::after {
            content: '';
            position: absolute;
            inset: -12%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(169, 156, 143, 0.28) 0%, rgba(169, 156, 143, 0) 70%);
            opacity: 0;
            transform: scale(0.6);
            animation: auraExpand 2.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
            pointer-events: none;
            z-index: 0;
        }

        .entrance-logo {
            position: relative;
            z-index: 1;
            max-width: 300px;
            width: 80vw;
            height: auto;
            cursor: pointer;
            display: block;
            opacity: 0;
            filter: blur(14px);
            transform: scale(0.9) translateY(14px);
            animation: logoReveal 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards,
                       logoFloat 5.5s ease-in-out 2s infinite;
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 0.7s ease,
                        opacity 0.3s ease;
        }

        .entrance-logo:hover {
            transform: scale(1.06) translateY(-2px);
            filter: drop-shadow(0 8px 22px rgba(169, 156, 143, 0.45));
        }

        .entrance-line {
            display: block;
            width: 0;
            height: 1px;
            margin: 26px auto 0;
            background: var(--text-light);
            opacity: 0.5;
            animation: lineDraw 1.1s cubic-bezier(0.16, 1, 0.3, 1) 1.15s forwards;
        }

        .enter-link {
            display: block;
            margin-top: 22px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            letter-spacing: 2px;
            color: var(--text-light);
            text-transform: uppercase;
            font-size: 0.8rem;
            opacity: 0;
            transform: translateY(6px);
            animation: linkReveal 1.1s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards;
            transition: letter-spacing 0.5s ease, opacity 0.4s ease;
        }

        .entrance-logo:hover ~ .enter-link,
        .enter-link:hover {
            opacity: 1;
            letter-spacing: 8px;
        }

        @keyframes containerRise {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes logoReveal {
            0% {
                opacity: 0;
                filter: blur(14px);
                transform: scale(0.9) translateY(14px);
            }
            60% {
                opacity: 1;
                filter: blur(0px);
            }
            100% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1) translateY(0);
            }
        }

        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        @keyframes auraExpand {
            0% {
                opacity: 0;
                transform: scale(0.6);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0.7;
                transform: scale(1);
            }
        }

        @keyframes ambientBreathe {
            0%, 100% {
                opacity: 0.4;
                transform: scale(1);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.08);
            }
        }

        @keyframes lineDraw {
            from {
                width: 0;
                opacity: 0;
            }
            to {
                width: 40px;
                opacity: 0.5;
            }
        }

        @keyframes linkReveal {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 0.65;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .entrance-container,
            .entrance-logo,
            .entrance-line,
            .enter-link,
            .logo-frame::after,
            body::before {
                animation: none !important;
                opacity: 1 !important;
                filter: none !important;
                transform: none !important;
            }
        }
    </style>
