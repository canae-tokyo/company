<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>ページが見つかりません｜株式会社CANAE</title>
  <link rel="stylesheet" href="/style.css?v=20260717c">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 5%;
      background: var(--bg-alt);
    }

    .not-found-inner {
      max-width: 560px;
    }

    .not-found-logo {
      width: 112px;
      height: auto;
      margin: 0 auto 32px;
    }

    .not-found h1 {
      width: auto;
      margin-bottom: 18px;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      text-shadow: none;
    }

    .not-found p {
      margin-bottom: 32px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="not-found" aria-labelledby="not-found-heading">
    <div class="not-found-inner">
      <img src="/assets/Ca_logo_g.png" alt="株式会社CANAE" class="not-found-logo" width="112" height="112">
      <h1 id="not-found-heading">ページが見つかりません</h1>
      <p>お探しのページは移動または削除された可能性があります。</p>
      <a href="/" class="btn">トップページへ戻る</a>
    </div>
  </main>
</body>
</html>
